<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Afraid of Tom Wolfe?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div id="start-screen">
            <h1>Who's Afraid of<br>Tom Wolfe?</h1>
            <p>Help Tom Wolfe escape from the literary critics!</p>
            <button id="start-button">START GAME</button>
            <div class="instructions">
                <p>Tap/click or use arrow keys to move Tom Wolfe and avoid the critics.</p>
                <p>Collect books to increase your score!</p>
            </div>
        </div>
        
        <div id="game-screen" class="hidden">
            <div id="stats">
                <div id="score">Score: 0</div>
                <div id="lives">Lives: 3</div>
            </div>
            <div id="game-area"></div>
        </div>
        
        <div id="game-over-screen" class="hidden">
            <h2>Game Over!</h2>
            <p>Your final score: <span id="final-score">0</span></p>
            <button id="restart-button">PLAY AGAIN</button>
        </div>
    </div>
    <script src="game.js"></script>
